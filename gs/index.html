<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>グリーンファイル道場 ～クイズに挑戦～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1E8E4F;
    --green-dark: #146339;
    --green-bright: #3DD16F;
    --navy: #1E2761;
    --orange: #FF8A3D;
    --yellow: #FFD166;
    --red: #E8495C;
    --gray: #5B6472;
    --light: #F3FBF5;
    --border: #CFEFDA;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: "M PLUS Rounded 1c", "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
    font-weight: 700;
    margin: 0;
    padding: 0;
    color: #1A2B1F;
    overflow-x: hidden;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 10% 8%, rgba(255,255,255,0.18) 0, rgba(255,255,255,0) 18%),
      radial-gradient(circle at 92% 15%, rgba(255,209,102,0.25) 0, rgba(255,209,102,0) 22%),
      radial-gradient(circle at 85% 90%, rgba(61,209,111,0.35) 0, rgba(61,209,111,0) 28%),
      linear-gradient(160deg, var(--green-dark) 0%, var(--green) 45%, #22A35C 100%);
    padding: 22px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  /* ---- Header ---- */
  .hero { text-align: center; color: #fff; margin-bottom: 18px; }
  .hero .badge-emoji { font-size: 58px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
  .hero h1 {
    font-size: 34px;
    margin: 10px 0 6px 0;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }
  .hero p { font-size: 17px; opacity: 0.95; margin: 0; font-weight: 700; }

  /* ---- Card ---- */
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 30px 28px;
    box-shadow: 0 16px 38px rgba(0,0,0,0.3);
    border: 4px solid var(--green-bright);
    position: relative;
  }

  /* ---- Start screen ---- */
  .start-screen { text-align: center; }
  .start-screen h2 { color: var(--green-dark); font-size: 27px; margin-bottom: 12px; font-weight: 900; }
  .start-screen p { color: var(--gray); font-size: 17px; line-height: 1.7; font-weight: 700; }
  .level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 22px 0 6px 0;
  }
  .level-btn {
    border: 3px solid var(--border);
    border-radius: 20px;
    padding: 24px 10px;
    cursor: pointer;
    background: var(--light);
    transition: transform .1s ease, box-shadow .1s ease;
    font-family: inherit;
    min-height: 150px;
  }
  .level-btn:active { transform: scale(0.96); }
  .level-btn:hover { border-color: var(--green); box-shadow: 0 8px 16px rgba(30,142,79,0.25); }
  .level-btn .emoji { font-size: 44px; }
  .level-btn .name { font-weight: 900; color: var(--green-dark); font-size: 20px; margin-top: 8px; }
  .level-btn .desc { color: var(--gray); font-size: 14px; margin-top: 6px; font-weight: 700; line-height: 1.5; }

  /* ---- Master button (giragira) ---- */
  .master-btn {
    position: relative;
    width: 100%;
    margin-top: 18px;
    min-height: 120px;
    border: none;
    border-radius: 20px;
    padding: 0;
    overflow: hidden;
    cursor: pointer;
    background: linear-gradient(120deg, #B8860B, #FFD700, #FFF3B0, #FFD700, #B8860B);
    background-size: 300% 300%;
    animation: master-gradient 6s ease infinite;
    box-shadow: 0 0 0 3px #FFF3B0, 0 10px 24px rgba(184,134,11,0.45);
  }
  @keyframes master-gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .master-btn:active { transform: scale(0.97); }
  .master-shine {
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-20deg);
    animation: master-shine-move 5.5s ease-in-out infinite;
  }
  @keyframes master-shine-move {
    0% { left: -60%; }
    18% { left: 130%; }
    100% { left: 130%; }
  }
  .master-inner {
    position: relative;
    z-index: 2;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .master-inner .emoji { font-size: 40px; text-shadow: 0 2px 6px rgba(0,0,0,0.25); }
  .master-inner .name {
    font-weight: 900;
    font-size: 22px;
    margin-top: 6px;
    color: #5A3E00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .master-inner .desc {
    color: #6B4A00;
    font-size: 14px;
    margin-top: 6px;
    font-weight: 800;
    line-height: 1.5;
  }
  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 16px;
    animation: sparkle-pop 1.1s ease-out forwards;
    z-index: 3;
  }
  @keyframes sparkle-pop {
    0% { opacity: 0; transform: translateY(0) scale(0.4) rotate(0deg); }
    30% { opacity: 1; transform: translateY(-8px) scale(1.1) rotate(45deg); }
    100% { opacity: 0; transform: translateY(-26px) scale(0.6) rotate(90deg); }
  }

  /* ---- Progress ---- */
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    font-size: 17px;
    color: var(--green-dark);
    font-weight: 900;
  }
  .progress-bar-outer {
    flex: 1;
    height: 14px;
    background: var(--border);
    border-radius: 7px;
    margin: 0 14px;
    overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--yellow), var(--green));
    width: 0%;
    transition: width .3s ease;
  }
  .score-pill {
    background: var(--navy);
    color: #fff;
    border-radius: 16px;
    padding: 7px 16px;
    font-weight: 900;
    font-size: 17px;
    white-space: nowrap;
  }

  /* ---- Question ---- */
  .category-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--green);
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    padding: 8px 16px;
    border-radius: 16px;
    margin-bottom: 14px;
  }
  .question-text {
    font-size: 24px;
    font-weight: 900;
    color: #16331F;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .options { display: flex; flex-direction: column; gap: 14px; }
  .option-btn {
    text-align: left;
    padding: 24px 22px;
    border: 3px solid var(--border);
    border-radius: 18px;
    background: #fff;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: all .12s ease;
    min-height: 72px;
    color: #223;
    line-height: 1.5;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--green); background: var(--light); }
  .option-btn:active:not(:disabled) { transform: scale(0.98); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { border-color: var(--green); background: #E3F9EB; color: var(--green-dark); }
  .option-btn.wrong { border-color: var(--red); background: #FDEBEC; color: var(--red); }

  .feedback {
    margin-top: 18px;
    padding: 20px;
    border-radius: 16px;
    font-size: 18px;
    line-height: 1.7;
    font-weight: 700;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: #E3F9EB; color: #145A32; border: 3px solid #9FE3B9; }
  .feedback.wrong-fb { background: #FDEBEC; color: #8c2a2a; border: 3px solid #F3C2C2; }
  .feedback .fb-title { font-weight: 900; margin-bottom: 8px; font-size: 21px; }

  .next-btn {
    margin-top: 20px;
    width: 100%;
    padding: 22px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(90deg, var(--green), var(--green-dark));
    color: #fff;
    font-weight: 900;
    font-size: 21px;
    cursor: pointer;
    display: none;
    box-shadow: 0 8px 16px rgba(30,142,79,0.3);
    font-family: inherit;
  }
  .next-btn:active { transform: scale(0.98); }
  .next-btn.show { display: block; }

  /* ---- Result ---- */
  .result-screen { text-align: center; display: none; }
  .result-screen.show { display: block; }
  .result-emoji { font-size: 72px; }
  .result-rank { font-size: 29px; font-weight: 900; color: var(--green-dark); margin: 10px 0 4px 0; }
  .result-score { font-size: 20px; color: var(--gray); margin-bottom: 20px; font-weight: 800; }
  .result-bar-wrap { background: var(--border); border-radius: 10px; height: 20px; overflow: hidden; margin-bottom: 20px; }
  .result-bar { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--green)); width: 0%; transition: width 1s ease; }

  .review-list { text-align: left; margin-top: 12px; }
  .review-list h3 { font-size: 19px; color: var(--green-dark); margin-bottom: 12px; font-weight: 900; }
  .review-item {
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    font-size: 16.5px;
    line-height: 1.65;
    font-weight: 700;
    border: 2px solid var(--border);
    background: var(--light);
  }
  .review-item.is-correct { border-left: 7px solid var(--green); }
  .review-item.is-wrong { border-left: 7px solid var(--red); background: #FFF7F7; }
  .review-item .rv-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; font-size: 18px; }
  .review-item .rv-q { font-weight: 900; }
  .review-item .rv-your { color: var(--red); margin-top: 6px; }
  .review-item .rv-correct { color: var(--green-dark); margin-top: 4px; }
  .review-item .rv-explain { color: #444; margin-top: 8px; font-weight: 600; }

  .source-note {
    margin-top: 20px;
    background: #FFF6E5;
    border: 3px dashed var(--orange);
    border-radius: 16px;
    padding: 18px 20px;
    font-size: 17px;
    color: #7a4b16;
    font-weight: 800;
    line-height: 1.7;
    text-align: left;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .source-note .sn-emoji { font-size: 26px; flex-shrink: 0; }

  .result-actions { display: flex; gap: 14px; margin-top: 20px; }
  .result-actions button {
    flex: 1;
    padding: 22px;
    border-radius: 18px;
    border: none;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    font-size: 18px;
  }
  .btn-retry { background: linear-gradient(90deg, var(--green), var(--green-dark)); color: #fff; box-shadow: 0 8px 16px rgba(30,142,79,0.3); }
  .btn-home { background: #fff; color: var(--green-dark); border: 3px solid var(--green) !important; }
  .result-actions button:active { transform: scale(0.97); }

  .idle-note {
    text-align: center;
    margin-top: 16px;
    font-size: 13.5px;
    color: rgba(255,255,255,0.9);
    font-weight: 700;
  }

  /* ---- Confetti ---- */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 9999;
    animation: confetti-fly .7s ease-out forwards;
  }
  @keyframes confetti-fly {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  #fireworksCanvas {
    position: fixed;
    inset: 0;
    display: none;
    pointer-events: none;
    z-index: 9998;
  }

  /* ---- Master Clear special celebration ---- */
  .gold-confetti-piece {
    position: fixed;
    border-radius: 2px;
    pointer-events: none;
    z-index: 10001;
    animation: gold-fall linear forwards;
  }
  @keyframes gold-fall {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0.15; }
  }

  .master-clear-overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: radial-gradient(circle, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 65%);
  }
  .master-clear-overlay.show { display: flex; }
  .master-clear-banner {
    background: linear-gradient(135deg, #FFD700, #FFF3B0, #FFD700);
    border: 4px solid #B8860B;
    border-radius: 24px;
    padding: 30px 44px;
    text-align: center;
    box-shadow: 0 0 50px rgba(255,215,0,0.85), 0 20px 50px rgba(0,0,0,0.35);
    transform: scale(0);
    animation: mc-pop 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
    max-width: 90vw;
  }
  @keyframes mc-pop {
    0% { transform: scale(0) rotate(-8deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .mc-crown { font-size: 64px; animation: mc-bounce 1s ease-in-out infinite; }
  @keyframes mc-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .mc-title {
    font-size: 30px;
    font-weight: 900;
    color: #5A3E00;
    margin-top: 8px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .mc-sub {
    font-size: 16px;
    font-weight: 800;
    color: #6B4A00;
    margin-top: 6px;
  }

  /* =========================================================
     📱 スマホ表示対応（モバイルレイアウト）
     ========================================================= */
  @media (max-width: 640px) {
    body { padding: 12px; }

    .hero { margin-bottom: 12px; }
    .hero .badge-emoji { font-size: 40px; }
    .hero h1 { font-size: 24px; margin: 8px 0 4px 0; letter-spacing: 0.5px; }
    .hero p { font-size: 13px; line-height: 1.5; }

    .card { padding: 18px 14px; border-radius: 18px; border-width: 3px; }

    .start-screen h2 { font-size: 20px; margin-bottom: 8px; }
    .start-screen p { font-size: 14px; }

    /* レベル選択：3列→1列に積む */
    .level-grid {
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 16px 0 4px 0;
    }
    .level-btn {
      min-height: auto;
      padding: 14px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      border-radius: 16px;
    }
    .level-btn .emoji { font-size: 30px; flex-shrink: 0; }
    .level-btn .name { font-size: 17px; margin-top: 0; }
    .level-btn .desc { font-size: 12.5px; margin-top: 2px; }

    /* マスターボタン：横一杯に使い、名前と説明を縦積みで余裕を持たせる */
    .master-btn { margin-top: 12px; min-height: auto; border-radius: 16px; }
    .master-inner {
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      padding: 16px 18px;
      gap: 4px;
    }
    .master-inner .emoji-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .master-inner .emoji { font-size: 28px; }
    .master-inner .name { font-size: 18px; margin-top: 0; white-space: nowrap; }
    .master-inner .desc { font-size: 12.5px; margin-top: 4px; line-height: 1.6; width: 100%; }

    /* 出題画面 */
    .progress-row { font-size: 13px; margin-bottom: 12px; }
    .progress-bar-outer { height: 10px; margin: 0 8px; }
    .score-pill { font-size: 13px; padding: 5px 10px; border-radius: 12px; }

    .category-tag { font-size: 12.5px; padding: 6px 12px; margin-bottom: 10px; border-radius: 12px; }
    .question-text { font-size: 18px; margin-bottom: 14px; }

    .options { gap: 10px; }
    .option-btn {
      padding: 16px 14px;
      font-size: 16px;
      min-height: 56px;
      border-radius: 14px;
      line-height: 1.4;
    }

    .feedback { padding: 14px; font-size: 14.5px; margin-top: 12px; border-radius: 12px; }
    .feedback .fb-title { font-size: 16.5px; margin-bottom: 6px; }

    .next-btn { padding: 16px; font-size: 16.5px; margin-top: 14px; border-radius: 14px; }

    /* 結果画面 */
    .result-emoji { font-size: 52px; }
    .result-rank { font-size: 21px; margin: 6px 0 2px 0; }
    .result-score { font-size: 15px; margin-bottom: 14px; }
    .result-bar-wrap { height: 14px; margin-bottom: 14px; }

    .review-list h3 { font-size: 15px; margin-bottom: 8px; }
    .review-item { padding: 12px 14px; font-size: 13.5px; border-radius: 12px; margin-bottom: 8px; }
    .review-item .rv-head { font-size: 14.5px; }

    .source-note { padding: 12px 14px; font-size: 13px; margin-top: 14px; border-radius: 12px; gap: 8px; }
    .source-note .sn-emoji { font-size: 20px; }

    .result-actions { flex-direction: column; gap: 10px; margin-top: 14px; }
    .result-actions button { padding: 16px; font-size: 15px; border-radius: 14px; }

    .idle-note { font-size: 11px; margin-top: 10px; }

    .mc-crown { font-size: 46px; }
    .mc-title { font-size: 21px; }
    .mc-sub { font-size: 13px; }
    .master-clear-banner { padding: 20px 26px; border-radius: 18px; }
  }

  @media (max-width: 380px) {
    .hero h1 { font-size: 20px; }
    .question-text { font-size: 16.5px; }
    .option-btn { font-size: 14.5px; padding: 14px 12px; }
  }
</style>
</head>
<body>
<canvas id="fireworksCanvas"></canvas>
<div class="master-clear-overlay" id="masterClearOverlay">
  <div class="master-clear-banner">
    <div class="mc-crown">👑</div>
    <div class="mc-title">マスタークリア！</div>
    <div class="mc-sub">グリーンファイル完全制覇、おめでとう✨</div>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="badge-emoji">🟩🟩📋🟩🟩</div>
    <h1>グリーンファイル道場</h1>
    <p>台帳ルールをクイズで楽しく覚えよう！　｜　㈱小俣組 グリーンファイル作成・提出ガイド準拠</p>
  </div>

  <div class="card" id="mainCard">

    <!-- Start Screen -->
    <div id="startScreen" class="start-screen">
      <h2>腕試しレベルを選んでください</h2>
      <p>レベルをタップしてスタート！</p>
      <div class="level-grid">
        <button class="level-btn" data-level="easy">
          <div class="emoji">🌱</div>
          <div class="name">初級</div>
          <div class="desc">ランダム5問<br>サクッと腕試し</div>
        </button>
        <button class="level-btn" data-level="normal">
          <div class="emoji">🔧</div>
          <div class="name">中級</div>
          <div class="desc">ランダム10問<br>しっかり復習</div>
        </button>
        <button class="level-btn" data-level="hard">
          <div class="emoji">🏗️</div>
          <div class="name">上級</div>
          <div class="desc">ランダム15問<br>腰を据えて挑戦</div>
        </button>
      </div>

      <button class="level-btn master-btn" data-level="master">
        <div class="master-shine"></div>
        <div class="master-inner">
          <div class="emoji-row">
            <div class="emoji">👑✨</div>
            <div class="name">マスター</div>
          </div>
          <div class="desc">全28問 コンプリートチャレンジ！ガイドを完全制覇せよ<br>👀 全問正解で特別演出！？</div>
        </div>
      </button>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" style="display:none;">
      <div class="progress-row">
        <span id="qCounter">問題 1 / 5</span>
        <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
        <span class="score-pill" id="scorePill">0 pt</span>
      </div>

      <div class="category-tag" id="categoryTag">導入・基本ルール</div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsArea"></div>

      <div class="feedback" id="feedbackArea">
        <div class="fb-title" id="fbTitle"></div>
        <div id="fbText"></div>
      </div>

      <button class="next-btn" id="nextBtn">次の問題へ</button>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="result-screen">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <div class="result-rank" id="resultRank">達人！</div>
      <div class="result-score" id="resultScoreText">5 / 5 問 正解</div>
      <div class="result-bar-wrap"><div class="result-bar" id="resultBar"></div></div>

      <div class="review-list" id="reviewList">
        <h3>全問ふりかえり</h3>
        <div id="reviewItems"></div>
      </div>

/* ===================== 控えめなクラッカー演出 ===================== */
function burstConfetti(x, y) {
  const colors = ["#3DD16F", "#FF8A3D", "#FFD166", "#1E2761", "#FFFFFF"];
  const count = 10;
  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    const angle = Math.random() * Math.PI * 2;
    const distance = 36 + Math.random() * 34;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance - 16;
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.setProperty("--dx", dx + "px");
    el.style.setProperty("--dy", dy + "px");
    el.style.setProperty("--rot", Math.random() * 360 + "deg");
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 720);
  }
}

function eventPoint(e) {
  if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  const rect = e.currentTarget.getBoundingClientRect();
  return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

/* ===================== 結果画面の花火演出 ===================== */
function launchFireworks(durationMs, colorOverride) {
  durationMs = durationMs || 3800;
  const canvas = document.getElementById("fireworksCanvas");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = "block";
  const ctx = canvas.getContext("2d");
  const colors = colorOverride || ["#3DD16F", "#FFD166", "#FF8A3D", "#1E2761", "#E8495C", "#FFFFFF"];
  let particles = [];

  function spawnBurst(x, y) {
    const color = colors[Math.floor(Math.random() * colors.length)];
    const count = 34;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
      const speed = 2.2 + Math.random() * 2.6;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 55 + Math.random() * 20,
        maxLife: 75,
        color,
        size: 2 + Math.random() * 2,
      });
    }
  }

  const burstTimer = setInterval(() => {
    spawnBurst(
      canvas.width * (0.15 + Math.random() * 0.7),
      canvas.height * (0.18 + Math.random() * 0.32)
    );
  }, 480);

  let elapsed = 0;
  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.045;
      p.life--;
      ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);
    elapsed += 16;

    if (elapsed < durationMs || particles.length > 0) {
      requestAnimationFrame(frame);
    } else {
      clearInterval(burstTimer);
      canvas.style.display = "none";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  requestAnimationFrame(frame);
  setTimeout(() => clearInterval(burstTimer), durationMs);
}

/* ===================== マスタークリア特別演出 ===================== */
function spawnGoldConfettiFromTop() {
  const el = document.createElement("div");
  el.className = "gold-confetti-piece";
  const goldColors = ["#FFD700", "#FFF3B0", "#FFA500", "#FFFFFF", "#B8860B"];
  const size = 7 + Math.random() * 7;
  const startX = Math.random() * window.innerWidth;
  el.style.width = size + "px";
  el.style.height = size + "px";
  el.style.left = startX + "px";
  el.style.top = "-20px";
  el.style.background = goldColors[Math.floor(Math.random() * goldColors.length)];
  const dx = (Math.random() * 160 - 80) + "px";
  const dy = (window.innerHeight + 60) + "px";
  const duration = 1.8 + Math.random() * 1.2;
  el.style.setProperty("--dx", dx);
  el.style.setProperty("--dy", dy);
  el.style.setProperty("--rot", Math.random() * 720 + "deg");
  el.style.animationDuration = duration + "s";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), duration * 1000 + 100);
}

function launchMasterClear() {
  const overlay = document.getElementById("masterClearOverlay");
  overlay.classList.add("show");

  let ticks = 0;
  const rainTimer = setInterval(() => {
    for (let i = 0; i < 4; i++) spawnGoldConfettiFromTop();
    ticks++;
    if (ticks > 28) clearInterval(rainTimer);
  }, 130);

  setTimeout(() => {
    overlay.classList.remove("show");
  }, 3400);
}

/* ===================== 自動リセット（無操作タイムアウト） ===================== */
const INACTIVITY_MS = 45000;
let inactivityTimer = null;

function scheduleAutoReset() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    if (quizScreen.style.display !== "none" || resultScreen.classList.contains("show")) {
      goHome();
    }
  }, INACTIVITY_MS);
}

["click", "touchstart"].forEach(evt => {
  document.addEventListener(evt, scheduleAutoReset, { passive: true });
});
scheduleAutoReset();

function goHome() {
  resultScreen.classList.remove("show");
  quizScreen.style.display = "none";
  startScreen.style.display = "block";
  document.getElementById("fireworksCanvas").style.display = "none";
}

/* ===================== シャッフル・出題構成 ===================== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 問題を複製し、選択肢の並び順もシャッフルして正解indexを再計算する
function shuffleQuestionOptions(original) {
  const optionIdx = original.options.map((opt, i) => ({ opt, i }));
  const shuffled = shuffle(optionIdx);
  const newOptions = shuffled.map(o => o.opt);
  const newCorrect = shuffled.findIndex(o => o.i === original.correct);
  return {
    category: original.category,
    q: original.q,
    options: newOptions,
    correct: newCorrect,
    explain: original.explain,
  };
}

/* ===================== クイズ本体 ===================== */
document.querySelectorAll(".level-btn").forEach(btn => {
  btn.addEventListener("click", e => {
    const p = eventPoint(e);
    burstConfetti(p.x, p.y);
    startQuiz(btn.dataset.level);
  });
});

/* ===================== マスターボタンのキラキラ演出 ===================== */
(function sparkleLoop() {
  const masterBtn = document.querySelector(".master-btn");
  if (!masterBtn) return;
  const symbols = ["✨", "⭐", "💫"];
  setInterval(() => {
    if (startScreen.style.display === "none") return;
    const rect = masterBtn.getBoundingClientRect();
    const s = document.createElement("span");
    s.className = "sparkle";
    s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    s.style.left = (rect.left + Math.random() * rect.width) + "px";
    s.style.top = (rect.top + Math.random() * rect.height) + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1100);
  }, 900);
})();

function startQuiz(level) {
  state.level = level;
  const count = LEVEL_COUNTS[level] || FULL_BANK.length;
  const pool = shuffle(FULL_BANK).slice(0, count);
  state.questions = pool.map(shuffleQuestionOptions);
  state.index = 0;
  state.score = 0;
  state.answered = false;
  state.answerLog = [];

  startScreen.style.display = "none";
  resultScreen.classList.remove("show");
  quizScreen.style.display = "block";
  renderQuestion();
}

function renderQuestion() {
  state.answered = false;
  const q = state.questions[state.index];
  document.getElementById("qCounter").textContent = `問題 ${state.index + 1} / ${state.questions.length}`;
  document.getElementById("scorePill").textContent = `${state.score} pt`;
  document.getElementById("progressBar").style.width = `${(state.index / state.questions.length) * 100}%`;
  document.getElementById("categoryTag").textContent = q.category;
  document.getElementById("questionText").textContent = q.q;

  const optionsArea = document.getElementById("optionsArea");
  optionsArea.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = opt;
    btn.addEventListener("click", e => selectAnswer(i, e));
    optionsArea.appendChild(btn);
  });

  document.getElementById("feedbackArea").classList.remove("show", "correct-fb", "wrong-fb");
  document.getElementById("nextBtn").classList.remove("show");

  // 新しい問題表示時は画面上部（カード先頭）が見えるようにスクロール
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function selectAnswer(i, e) {
  if (state.answered) return;
  state.answered = true;
  const p = eventPoint(e);
  burstConfetti(p.x, p.y);

  const q = state.questions[state.index];
  const isCorrect = i === q.correct;
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.correct) b.classList.add("correct");
    if (idx === i && i !== q.correct) b.classList.add("wrong");
  });

  const fb = document.getElementById("feedbackArea");
  const fbTitle = document.getElementById("fbTitle");
  const fbText = document.getElementById("fbText");
  fbText.textContent = q.explain;

  if (isCorrect) {
    state.score += 1;
    fb.classList.add("show", "correct-fb");
    fbTitle.textContent = "⭕ 正解！";
  } else {
    fb.classList.add("show", "wrong-fb");
    fbTitle.textContent = "❌ 不正解";
  }

  state.answerLog.push({
    q: q.q,
    options: q.options,
    userIndex: i,
    correctIndex: q.correct,
    isCorrect,
    explain: q.explain,
  });

  document.getElementById("scorePill").textContent = `${state.score} pt`;
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.classList.add("show");

  // 選択肢クリック後、フィードバックと「次の問題へ」ボタンが見える位置まで
  // 自動スクロール（次へボタンを画面の下端付近に置く）
  requestAnimationFrame(() => {
    setTimeout(() => {
      const btnRect = nextBtn.getBoundingClientRect();
      const targetScrollY = window.scrollY + btnRect.bottom - window.innerHeight + 24;
      window.scrollTo({
        top: Math.max(targetScrollY, 0),
        behavior: "smooth",
      });
    }, 80);
  });
}

document.getElementById("nextBtn").addEventListener("click", e => {
  const p = eventPoint(e);
  burstConfetti(p.x, p.y);
  state.index += 1;
  if (state.index >= state.questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
});

function showResult() {
  quizScreen.style.display = "none";
  resultScreen.classList.add("show");
  window.scrollTo({ top: 0, behavior: "auto" });

  const total = state.questions.length;
  const ratio = state.score / total;
  const rankInfo = RANKS.find(r => ratio >= r.min);

  document.getElementById("resultEmoji").textContent = rankInfo.emoji;
  document.getElementById("resultRank").textContent = rankInfo.rank;
  document.getElementById("resultScoreText").textContent = `${state.score} / ${total} 問 正解`;

  setTimeout(() => {
    document.getElementById("resultBar").style.width = `${ratio * 100}%`;
  }, 100);

  if (state.level === "master" && state.score === total) {
    launchFireworks(6000, ["#FFD700", "#FFF3B0", "#FFA500", "#FFFFFF", "#B8860B"]);
    launchMasterClear();
  } else {
    launchFireworks();
  }

  const reviewItems = document.getElementById("reviewItems");
  reviewItems.innerHTML = "";
  state.answerLog.forEach((log, idx) => {
    const div = document.createElement("div");
    div.className = "review-item " + (log.isCorrect ? "is-correct" : "is-wrong");

    const headEmoji = log.isCorrect ? "⭕" : "❌";
    let html = `<div class="rv-head">${headEmoji} <span class="rv-q">問${idx + 1}. ${log.q}</span></div>`;
    if (!log.isCorrect) {
      html += `<div class="rv-your">あなたの回答：${log.options[log.userIndex]}</div>`;
    }
    html += `<div class="rv-correct">正解：${log.options[log.correctIndex]}</div>`;
    html += `<div class="rv-explain">${log.explain}</div>`;
    div.innerHTML = html;
    reviewItems.appendChild(div);
  });
}

document.getElementById("btnRetrySame").addEventListener("click", e => {
  const p = eventPoint(e);
  burstConfetti(p.x, p.y);
  startQuiz(state.level);
});

document.getElementById("btnHome").addEventListener("click", e => {
  const p = eventPoint(e);
  burstConfetti(p.x, p.y);
  goHome();
});
</script>
